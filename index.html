<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地震ゲーム（ニュース画面つき）</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f3f6;--pn:#fff;--tx:#1b2330;--mu:#5d6b80;--bd:#d5dbe4;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131b;--pn:#171e29;--tx:#e8edf5;--mu:#93a1b5;--bd:#2a3444;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e131b;--pn:#171e29;--tx:#e8edf5;--mu:#93a1b5;--bd:#2a3444;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"Hiragino Sans","Yu Gothic",sans-serif}
.w{display:grid;grid-template-columns:minmax(0,543px) minmax(260px,1fr);gap:12px;padding:12px;max-width:960px;margin:auto}
@media(max-width:700px){.w{grid-template-columns:minmax(0,1fr)}}
.p{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
#tv{width:100%;height:auto;display:block;border-radius:8px 8px 0 0;background:#000}#bn{padding:8px 12px;border-radius:0;font-weight:700;background:#33415c;color:#fff}
#bn.al{background:#d90429;animation:b .5s infinite alternate}@keyframes b{to{opacity:.55}}
canvas{width:100%;height:auto;display:block;border-radius:0 0 8px 8px;background:#0b1d33;cursor:crosshair}label{display:block;margin:8px 0 2px;color:var(--mu)}input[type=range]{width:100%}.ev.t{display:inline-block;width:auto;margin-right:4px;padding:4px 10px}
button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;margin:2px 0;cursor:pointer;text-align:left}
.ev{display:block;width:100%}.ev.on{border-color:#d90429;box-shadow:inset 3px 0 0 #d90429}
.ev small{display:block}
button.m{background:#d90429;color:#fff;border-color:#d90429;font-weight:700;text-align:center;width:100%;margin-top:6px}
#mx{font-size:34px;font-weight:800;display:inline-block;padding:0 12px;border-radius:6px}
.r{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px solid var(--bd)}
.s{display:inline-block;min-width:34px;text-align:center;border-radius:4px;font-weight:700;color:#111}
.lg{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.lg span{padding:1px 6px;border-radius:4px;font-size:12px;font-weight:700;color:#111}
small{color:var(--mu)}
#cmh{display:flex;justify-content:space-between;background:#16233d;color:#cfe0ff;font-size:12px;padding:3px 8px}#cm{background:#0b1220;color:#e8edf5;height:96px;overflow-y:auto;font-size:12px;line-height:1.5;padding:2px 8px}#tvs,#lay{display:flex;flex-wrap:wrap;gap:4px;background:var(--pn);border:1px solid var(--bd);padding:4px}#tvs{border-radius:8px 8px 0 0;border-bottom:0}#tvs button,#lay button{margin:0;padding:3px 8px;font-size:12px}#layd{font-size:12px;color:var(--mu);background:var(--pn);padding:4px 8px;border:1px solid var(--bd);border-top:0;margin-bottom:0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#2fbf71}.dot.shk{background:#ffb703}.dot.down{background:#ff4d4d}.r.af{cursor:pointer}.r.af:hover,.r.af.on{background:var(--bg)}#tv{border-radius:0}</style></head><body>
<div class="w">
<div><div id="tvs"></div><canvas id="tv"></canvas><div id="cmh"><span>視聴者コメント</span><span id="cmn"></span></div><div id="cm"></div><div id="bn">地震情報（平常）</div><div id="lay"></div><div id="layd"></div><canvas id="c"></canvas></div>
<div>
<div class="p"><b>震源を指定して発生させる</b>
<div style="margin:6px 0"><button class="ev t on" id="m1">自由モード</button><button class="ev t" id="m2">再現チャレンジ</button></div>
<div id="chs" hidden><small>実際の地震の観測震度を再現しよう。</small><div id="evs"></div><button class="ev t" id="tg">目標の震度を見る</button><button class="ev t" id="an">答えを見る</button><div id="sc" style="margin-top:4px"></div></div>
<div id="ep" style="margin-top:6px"></div><small>地図をクリックして震源を設定</small>
<label>マグニチュード M <b id="mv"></b></label><input id="m" type="range" min="4" max="12" step="0.1" value="7.5">
<label>震源の深さ <b id="dv"></b> km</label><input id="d" type="range" min="0" max="300" step="2" value="20">
<label>時間の進み方</label><div><button class="ev t on" id="tm1">ゲーム（短縮）</button><button class="ev t" id="tm2">リアルタイム（実際の秒数）</button></div>
<label>再生速度（P波・S波・津波の進む速さ）</label><div id="sp"></div><label><input type="checkbox" id="snd" checked> 警報音</label>
<button class="m" id="go">▶ 地震を発生させる</button></div>
<div class="p"><div id="hd" style="margin-bottom:6px"></div><span id="mx"></span> <small>最大震度</small>
<div id="ew" style="margin-top:8px"></div><div id="ts" style="margin-top:6px"></div><div class="lg" id="lg"></div></div>
<div class="p"><b>余震</b> <small id="afn"></small><div id="afl"><small>地震を発生させると表示されます</small></div></div>
<div class="p"><b>震度の高い都道府県</b><div id="ls"></div></div>
<small>地図は国土数値情報（行政区域データ N03-23）を簡略化したものです。震度は司・翠川式の簡易版を実際の3地震に合わせて補正。死者数などの被害・ニュース内容は、ゲーム用の架空の推計です。</small>
</div></div>

epT=()=>{const[x,y]=px(...ep),l=x>=0&&y>=0&&x<W&&y<H&&mid[(y|0)*W+(x|0)]>=0;$('ep').innerHTML=`震源: 北緯${ep[1].toFixed(2)}° 東経${ep[0].toFixed(2)}° <small>（${l?'陸域':'海域'}）</small>`},
showT=()=>{view=1;st=null;const o=obs(EV[tgt]);paint(new Uint8Array(NM).fill(1),Array.from(mp,p=>o[p]));$('bn').className='';$('bn').textContent='目標: '+EV[tgt].d+' の地震の観測震度（これを再現しよう）'},
setMode=m=>{mode=m;$('chs').hidden=!m;$('m1').classList.toggle('on',!m);$('m2').classList.toggle('on',!!m);
 if(m){showT()}else{view=0;st=null;paint(new Uint8Array(NM),[]);$('bn').className='';$('bn').textContent='地震情報（平常）'}};
$('tvs').innerHTML=TVL.map(([k,l])=>`<button class="ev t${k==TVS?' on':''}" data-s="${k}"><span class="dot"></span>${l}</button>`).join('');
document.querySelectorAll('#tvs .ev').forEach(b=>b.onclick=()=>{const v=b.dataset.s;TVS=v=='auto'||v=='us'?v:+v;document.querySelectorAll('#tvs .ev').forEach(x=>x.classList.toggle('on',x===b));tkT=''});
$('lay').innerHTML=LAYS.map(([k,l])=>`<button class="ev t${k==LAY?' on':''}" data-l="${k}">${l}</button>`).join('');
document.querySelectorAll('#lay .ev').forEach(b=>b.onclick=()=>{LAY=b.dataset.l;if(LAY!='aft')AFSEL=-1;refreshLay()});
$('layd').textContent=LAYD[LAY];
$('m').oninput=$('d').oninput=upd;upd();epT();
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;ep=[LX+x/(S*K),LY-y/S];epT()};
$('go').onclick=quake;$('m1').onclick=()=>setMode(0);$('m2').onclick=()=>setMode(1);$('tg').onclick=showT;
$('sp').innerHTML=[1,2,4,8,16].map(v=>`<button class="ev t${v==SPD?' on':''}" data-s="${v}">×${v}</button>`).join('');
const setSpd=v=>{SPD=v;document.querySelectorAll('#sp .ev').forEach(x=>x.classList.toggle('on',+x.dataset.s==v))};
document.querySelectorAll('#sp .ev').forEach(b=>b.onclick=()=>setSpd(+b.dataset.s));
// リアルタイム: 実際の秒数（P波7km/s・S波3.8km/s・津波約0.2km/s、震度速報は約1.7分後、津波警報は約3分後）
const setTM=r=>{RT=r;RATE=r?1:6;VT=r?.195:.8;TSH=r?100:60;TT1=r?180:100;TAF=r?480:265;TST=r?60:35;$('tm1').classList.toggle('on',!r);$('tm2').classList.toggle('on',!!r);if(r)setSpd(1);st=null;if(!view){paint(new Uint8Array(NM),[]);$('bn').className='';$('bn').textContent='地震情報（平常）'}};
$('tm1').onclick=()=>setTM(0);$('tm2').onclick=()=>setTM(1);
$('evs').innerHTML=EV.map((e,i)=>`<button class="ev t${i?'':' on'}" data-k="${i}">${e.d} の地震</button>`).join('');
document.querySelectorAll('#evs .ev').forEach(b=>b.onclick=()=>{tgt=+b.dataset.k;document.querySelectorAll('#evs .ev').forEach(x=>x.classList.toggle('on',x===b));$('sc').innerHTML='';showT()});
$('an').onclick=()=>{const e=EV[tgt];ep=[e.lo,e.la];$('m').value=e.M;$('d').value=e.dp;upd();epT();quake();$('sc').innerHTML+=`<br><small>答え: ${e.t} ／ 北緯${e.la}° 東経${e.lo}° ／ M${e.M} ／ 深さ${e.dp}km</small>`};
$('lg').innerHTML=LB.map((l,i)=>i?`<span style="background:${CL[i]};${[3,7,8,9].includes(i)?'color:#fff':''}">${l}</span>`:'').join('')+`<span style="background:${UNK};color:#cdd6e4">未取得</span><span style="background:#ff7a00;color:#fff">警報対象</span>`;
paint(new Uint8Array(NM),[]);requestAnimationFrame(frame);

</script></body></html>
